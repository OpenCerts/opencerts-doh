name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          check-latest: true
      
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      
      - name: Run tests
        run: npm test
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        # dev and prod are separate AWS accounts; dev uses the DEV_-prefixed secrets
        with:
          aws-access-key-id: ${{ github.event.inputs.stage == 'prod' && secrets.AWS_ACCESS_KEY_ID || secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ github.event.inputs.stage == 'prod' && secrets.AWS_SECRET_ACCESS_KEY || secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Deploy with Serverless Framework
        env:
          PROJECT_NAME: opencerts-doh
          # DXT-924: Serverless 3.39 cannot load the ESM serverless-offline plugin under Node 22's require(esm)
          NODE_OPTIONS: --no-experimental-require-module
        run: |
          STAGE=${{ github.event.inputs.stage || 'dev' }}
          npx serverless deploy --stage $STAGE --verbose
